
<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قلب‌های نئونی ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #050005;
      color: white;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    button {
      position: fixed;
      bottom: 30px;
      z-index: 2;
      padding: 12px 22px;
      border-radius: 25px;
      border: 1px solid #ff1744;
      background: #21000b;
      color: white;
      font-size: 15px;
      box-shadow: 0 0 18px #ff1744;
    }

    .caption {
      position: fixed;
      top: 8%;
      color: #ff315b;
      letter-spacing: 4px;
      text-shadow: 0 0 15px red;
      z-index: 1;
    }
  </style>
</head>

<body>
  <canvas id="heartCanvas"></canvas>

  <div class="caption">MADE WITH LOVE ♥</div>

  <script>
    const canvas = document.getElementById("heartCanvas");
    const ctx = canvas.getContext("2d");
    let width, height, startTime;

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;

      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function heart(t) {
      return {
        x: 16 * Math.pow(Math.sin(t), 3),
        y: -(13 * Math.cos(t)
          - 5 * Math.cos(2 * t)
          - 2 * Math.cos(3 * t)
          - Math.cos(4 * t))
      };
    }

    function drawHeart(size, progress, glow) {
      const points = 240;
      const count = Math.floor(points * progress);

      if (count < 2) return;

      ctx.beginPath();

      for (let i = 0; i <= count; i++) {
        const p = heart(i / points * Math.PI * 2);
        const x = width / 2 + p.x * size;
        const y = height / 2 + p.y * size;

        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }

      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.shadowColor = "#ff003c";

      ctx.strokeStyle = "#ff003c";
      ctx.lineWidth = Math.max(1, size * 0.16);
      ctx.shadowBlur = glow * 3;
      ctx.stroke();

      ctx.strokeStyle = "#ff1744";
      ctx.lineWidth = Math.max(1, size * 0.09);
      ctx.shadowBlur = glow * 1.8;
      ctx.stroke();

      ctx.strokeStyle = "#fff0f4";
      ctx.lineWidth = Math.max(1, size * 0.035);
      ctx.shadowBlur = glow;
      ctx.stroke();

      ctx.shadowBlur = 0;
    }


    function drawName(beat) {
      const letters = ["J", "A", "N", "A"];
      const fontSize = Math.max(8, Math.min(width, height) * 0.018);

      ctx.save();
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = `bold ${fontSize}px Arial, sans-serif`;
      ctx.fillStyle = "#fff0f4";
      ctx.shadowColor = "#ff1744";
      ctx.shadowBlur = 12;

      const x = width / 2;
      const startY = height / 2 - Math.min(width, height) * 0.13 * beat;
      const spacing = fontSize * 0.9;

      letters.forEach((letter, i) => {
        ctx.fillText(letter, x, startY + i * spacing);
      });

      ctx.restore();
    }

    function animate(now) {
      ctx.clearRect(0, 0, width, height);

      const elapsed = now - startTime;
      const pulse = now % 1800;

      const beat = pulse < 180
        ? 1 + Math.sin((pulse / 180) * Math.PI) * 0.12
        : pulse < 360
          ? 1 + Math.sin(((pulse - 180) / 180) * Math.PI) * 0.07
          : 1 + Math.sin(now * 0.002) * 0.012;

      for (let i = 0; i < 16; i++) {
        const progress = Math.min(
          1, Math.max(0, (elapsed - i * 150) / 2200)
        );

        const size = (0.22 + i * 0.075)
          * Math.min(width, height) / 48 * beat;

        drawHeart(size, progress, 30 + i * 2.5);
      }

      const nameProgress = Math.min(1, Math.max(0, (elapsed - 2200) / 1000));
      if (nameProgress > 0) {
        ctx.globalAlpha = nameProgress;
        drawName(beat);
        ctx.globalAlpha = 1;
      }

      requestAnimationFrame(animate);
    }

    document.addEventListener("pointerdown", () => {
      startTime = performance.now();
    });

    window.addEventListener("resize", resize);

    resize();
    startTime = performance.now();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
